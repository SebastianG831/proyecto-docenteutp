<div class="auth-page">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="DocenteUTP, inicio">
      <span class="brand-mark" aria-hidden="true">
        <img class="brand-icon" src="assets/figma/graduation/icon.svg" alt="" />
      </span>
      <span class="brand-copy">
        <span class="brand-name">DocenteUTP</span>
        <span class="brand-tagline">Opiniones que orientan</span>
      </span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <header class="auth-header">
        <h1>Crear cuenta</h1>
        <p>Únete a la comunidad de estudiantes UTP</p>
      </header>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input
            id="nombre"
            type="text"
            autocomplete="name"
            [(ngModel)]="nombre"
            name="nombre"
            required
            placeholder="Ana María González"
            [disabled]="loading()"
          />
        </div>

        <div class="form-group">
          <label for="email">Correo UTP</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            [(ngModel)]="email"
            name="email"
            required
            placeholder="ana.gonzalez@utp.edu.pe"
            [disabled]="loading()"
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              id="password"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="password"
              name="password"
              required
              minlength="6"
              placeholder="••••••••"
              [disabled]="loading()"
            />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
              placeholder="••••••••"
              [disabled]="loading()"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="carrera">Carrera</label>
          <select
            id="carrera"
            [(ngModel)]="carrera"
            name="carrera"
            required
            [disabled]="loading()"
          >
            <option value="">Selecciona tu carrera</option>
            <option *ngFor="let c of carreras" [value]="c">{{ c }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ciclo">Ciclo</label>
          <input
            id="ciclo"
            type="number"
            [(ngModel)]="ciclo"
            name="ciclo"
            required
            min="1"
            max="10"
            [disabled]="loading()"
          />
        </div>

        <div class="form-error" *ngIf="error()">{{ error() }}</div>

        <button type="submit" class="btn-primary" [disabled]="!canSubmit()">
          <span *ngIf="loading()">Creando cuenta...</span>
          <span *ngIf="!loading()">Crear cuenta</span>
        </button>
      </form>

      <footer class="auth-footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
      </footer>
    </div>
  </main>
</div>
