<div class="home-page" id="inicio" data-node-id="1:2" data-name="DocenteUTP - Inicio">
  <header class="topbar" data-node-id="1:3" data-name="Navbar">
    <a class="brand" href="#inicio" aria-label="DocenteUTP, inicio" data-node-id="1:4" data-name="Brand">
      <span class="brand-mark" aria-hidden="true" data-node-id="1:5">
        <img class="brand-icon" src="assets/figma/graduation/icon.svg" alt="" data-node-id="1:7" />
      </span>
      <span class="brand-copy">
        <span class="brand-name">DocenteUTP</span>
        <span class="brand-tagline">Opiniones que orientan</span>
      </span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal" data-node-id="1:13">
      <a class="nav-link is-active" routerLink="/buscar" aria-current="page">Explorar docentes</a>
      <a class="nav-link" routerLink="/mis-resenas">Mis reseñas</a>
      <a class="nav-link" href="#como-funciona">Cómo funciona</a>
    </nav>

    <div class="user-controls" data-node-id="1:17">
      <a class="saved-link" routerLink="/guardados" data-node-id="1:18">
        <img src="assets/figma/bookmark/icon.svg" alt="" data-node-id="1:19" />
        <span>Guardados</span>
      </a>
      <span class="avatar" aria-label="Usuario: Ana María" data-node-id="1:22">AM</span>
    </div>
  </header>

  <main class="page-content">
    <section class="welcome" aria-labelledby="welcome-title" data-node-id="1:25" data-name="Welcome Header">
      <div class="welcome-copy">
        <p class="campus-label">UTP Lima Centro · Edificio Arequipa</p>
        <h1 id="welcome-title">Elige tus cursos con confianza</h1>
        <p class="welcome-description">Opiniones honestas de estudiantes que ya estuvieron ahí.</p>
      </div>
      <div class="verified-badge" data-node-id="1:30">
        <img src="assets/figma/shield-check/icon.svg" alt="" data-node-id="1:32" />
        <span>Comunidad verificada UTP</span>
      </div>
    </section>

    <section class="search-card" id="buscar" aria-label="Buscar docentes y cursos" data-node-id="1:36" data-name="Search and Filters">
      <form class="search-form" (submit)="onSearch($event)" role="search" data-node-id="1:37">
        <img class="search-icon" src="assets/figma/search/icon.svg" alt="" data-node-id="1:40" />
        <label class="visually-hidden" for="teacher-search">Buscar por docente, curso o código</label>
        <input
          id="teacher-search"
          name="q"
          type="search"
          autocomplete="off"
          placeholder="Busca por docente, curso o código (ej. MAT-101)"
          [value]="searchTerm"
          (input)="searchTerm = $any($event.target).value"
        />
        <button type="submit">Buscar</button>
      </form>
    </section>
  </main>
</div>
